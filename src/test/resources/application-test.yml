spring:
  datasource:
    url: jdbc:h2:mem:db;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: true
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true

logging:
  level:
    org:
      hibernate:
        type: trace
    amazonaws:
      util:
        EC2MetadataUtils: error

server:
  compression:
    enabled: true
    mime-types: text/html,text/plain,text/css,application/javascript,application/json
    min-response-size: 500
  session:
    cookie:
      http-only: false
  servlet:
    context-path: /api

# OAuth
cors:
  allow-origin:
    urls: http://localhost:8080, http://localhost:3000, http://localhost:3000/kakao-callback

oauth:
  kakao:
    client-id: dummy-kakao-client-id
    client-secret: dummy-kakao-client-secret
    authorization-endpoint: https://kauth.kakao.com/oauth/authorize
    response-type: code
    scopes:
      - profile_nickname
      - profile_image
    token-uri: https://kauth.kakao.com/oauth/token # 액세스 토큰 받을 때 필요한 endpoint
    user-info-uri: https://kapi.kakao.com/v2/user/me # 액세스 토큰을 사용하여 이 endpoint 를 호출하여 사용자의 정보를 가져올 때 사용

security:
  jwt:
    token:
      secret-key: hibi-dummy-secret-key-for-test-12345678901234567890
      access:
        expire-length : 3600000 #1시간
      refresh:
        expire-length: 1210000000 #14일
